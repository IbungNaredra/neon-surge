# Render Blueprint — WebSocket relay for NEON SURGE
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: neon-surge-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MAX_ROOMS
        value: "100"
      - key: MAX_PLAYERS_PER_ROOM
        value: "4"
      - key: ROOM_TTL_MINUTES
        value: "30"
